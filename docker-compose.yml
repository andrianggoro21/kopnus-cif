x-backend-build: &backend-build
  context: ./backend
  target: app

x-backend-env: &backend-env
  APP_NAME: CIF Checking
  APP_ENV: production
  APP_KEY: ${APP_KEY:-}
  APP_DEBUG: "false"
  APP_URL: http://localhost:${WEB_PORT:-8080}
  LOG_CHANNEL: stderr
  LOG_LEVEL: info
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE:-cif}
  DB_USERNAME: ${DB_USERNAME:-cif}
  DB_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di .env (salin dari .env.example)}
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  SESSION_DRIVER: array
  CUSTOMER_INFO_URL: ${CUSTOMER_INFO_URL:-https://candidate.free.beeceptor.com/api/customer-information}
  SCORING_URL: ${SCORING_URL:-https://candidate.free.beeceptor.com/api/scoring}
  CUSTOMER_INFO_CACHE_TTL: ${CUSTOMER_INFO_CACHE_TTL:-300}
  EXTERNAL_HTTP_TIMEOUT: ${EXTERNAL_HTTP_TIMEOUT:-10}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cif}
      MYSQL_USER: ${DB_USERNAME:-cif}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di .env (salin dari .env.example)}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Isi DB_ROOT_PASSWORD di .env (salin dari .env.example)}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: *backend-build
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "1"
    volumes:
      - uploads:/var/www/html/storage/app/private
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 3s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  queue:
    build: *backend-build
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=1"]
    environment: *backend-env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      WEB_PORT: ${WEB_PORT:-8080}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    volumes:
      - ./testdata:/var/www/testdata:ro

volumes:
  mysql-data:
  uploads:
